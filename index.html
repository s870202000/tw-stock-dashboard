<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股法人/散戶儀表板 V3</title>
  <style>
    :root {
      --bg: #08111f; --panel: #0f1b2d; --line: rgba(255,255,255,.08);
      --text: #eaf2ff; --muted: #9fb2d1; --brand: #4ea1ff;
      --good: #3dd598; --danger: #ff6b7a; --radius: 18px;
    }
    body { margin: 0; font-family: sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; padding: 20px; }
    .shell { width: min(1480px, calc(100vw - 32px)); margin: 0 auto; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,.3); margin-bottom: 20px; }
    .toolbar { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    
    /* V3 特色：加大日期選擇器 */
    input[type="date"] {
      background: #16243a; color: #fff; border: 2px solid var(--brand);
      border-radius: 12px; padding: 12px 18px; font-size: 18px; font-weight: bold; cursor: pointer;
    }
    .btn { background: var(--brand); color: #fff; border: 0; padding: 14px 30px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; }
    
    /* 表格與排序樣式 */
    .table-wrap { overflow-x: auto; width: 100%; border-radius: 14px; border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    th, td { padding: 15px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { cursor: pointer; background: rgba(255,255,255,0.05); user-select: none; }
    th:hover { background: rgba(78,161,255,0.15); }
    .up { color: var(--good); } .down { color: var(--danger); }
    
    .layout-2 { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
    @media (max-width: 1024px) { .layout-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <h1>台股法人/散戶籌碼觀測站 V3</h1>
      <div class="toolbar">
        <div style="display:flex; flex-direction:column; gap:5px;">
          <label style="font-size:13px; color:var(--muted)">查詢日期</label>
          <input type="date" id="dateInput">
        </div>
        <button class="btn" id="refreshBtn" style="margin-top:18px">重新整理</button>
        <div style="flex:1"></div>
        <div id="statusText" style="margin-top:18px; color:var(--muted)">載入中...</div>
      </div>
    </div>

    <div class="card">
      <h2>個股/ETF 搜尋</h2>
      <input type="search" id="stockSearch" style="width:100%; padding:15px; background:#16243a; color:white; border:1px solid var(--line); border-radius:12px;" placeholder="輸入代號或名稱，例如 2330、台積電、0050">
      <div id="searchResults" style="margin-top:15px; display:grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap:15px;"></div>
    </div>

    <div class="layout-2">
      <div class="card">
        <h2>1. 每日法人 / 散戶買賣量綜合</h2>
        <div id="flowSummaryTable" class="table-wrap"></div>
      </div>
      <div class="card">
        <h2>量能視覺摘要</h2>
        <div id="flowBars" style="display:flex; flex-direction:column; gap:18px; margin-top:10px;"></div>
      </div>
    </div>

    <div class="card">
      <h2>最新財報潛力前 20 (點擊標題排序)</h2>
      <div id="potentialTable" class="table-wrap"></div>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
