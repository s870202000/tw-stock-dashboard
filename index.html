<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股法人籌碼觀測站 V5</title>
  <style>
    :root {
      --bg: #08111f; --panel: #0f1b2d; --line: rgba(255,255,255,.08);
      --text: #eaf2ff; --muted: #9fb2d1; --brand: #4ea1ff;
      --good: #3dd598; --danger: #ff6b7a; --radius: 18px;
    }
    body { margin: 0; font-family: "Noto Sans TC", sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; padding: 20px; }
    .shell { width: min(1480px, calc(100vw - 32px)); margin: 0 auto; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,.3); margin-bottom: 20px; }
    h1, h2 { margin: 0 0 15px; }
    .toolbar { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    input[type="date"], input[type="search"] {
      background: #16243a; color: #fff; border: 2px solid var(--brand);
      border-radius: 10px; padding: 12px; font-size: 16px; font-weight: bold;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(48%) sepia(79%) saturate(1000%) hue-rotate(190deg); cursor: pointer; scale: 1.3;
    }
    .btn { background: var(--brand); color: #fff; border: 0; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: 700; }
    .table-wrap { overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { padding: 14px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { cursor: pointer; background: rgba(255,255,255,0.05); }
    th:hover { background: rgba(78,161,255,0.2); }
    .up { color: var(--good); } .down { color: var(--danger); }
    .status { font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <h1>台股法人/散戶籌碼觀測站 V5</h1>
      <div class="toolbar">
        <input type="date" id="dateInput">
        <button class="btn" id="refreshBtn">重新整理</button>
        <span id="statusText" class="status">載入中...</span>
      </div>
    </div>
    <div class="card">
      <h2>個股搜尋 (連動下方買賣量)</h2>
      <input type="search" id="stockSearch" style="width:100%" placeholder="輸入代號或名稱，例如 2330 或 台積電">
    </div>
    <div class="card">
      <h2 id="flowTitle">1. 每日法人 / 散戶買賣量綜合 (全市場)</h2>
      <div class="table-wrap" id="flowSummaryTable"></div>
    </div>
    <div class="card">
      <h2>最新財報：潛力前 20 (點標題可排序)</h2>
      <div class="table-wrap" id="potentialTable"></div>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
