<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股法人/散戶儀表板 V5</title>
  <style>
    :root {
      --bg: #08111f; --panel: #0f1b2d; --line: rgba(255,255,255,.08);
      --text: #eaf2ff; --muted: #9fb2d1; --brand: #4ea1ff;
      --brand-2: #79f7c4; --danger: #ff6b7a; --warn: #ffca5c;
      --good: #3dd598; --shadow: 0 18px 40px rgba(0,0,0,.35); --radius: 18px;
    }
    body { margin: 0; font-family: Inter, "Noto Sans TC", sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; }
    .shell { width: min(1480px, calc(100vw - 32px)); margin: 24px auto; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
    h1, h2 { margin: 0 0 10px; }
    .toolbar { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    
    /* 亮藍色大日期 UI */
    input[type="date"] {
      background: #16243a; color: #fff; border: 2px solid var(--brand);
      border-radius: 10px; padding: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(48%) sepia(79%) saturate(1000%) hue-rotate(190deg) brightness(120%);
      cursor: pointer; scale: 1.3;
    }
    .btn { background: var(--brand); color: #fff; border: 0; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    
    /* 搜尋框 */
    input[type="search"] { background: #16243a; color: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%; }
    
    /* 表格控制 */
    .table-wrap { overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 800px; }
    th, td { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { cursor: pointer; background: rgba(255,255,255,0.05); user-select: none; }
    th:hover { background: rgba(78,161,255,0.2); }
    .up { color: var(--good); } .down { color: var(--danger); }
    
    .layout-2 { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: start; }
    @media (max-width: 1024px) { .layout-2 { grid-template-columns: 1fr; } }
    
    .loading-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 999; }
    .loading-mask.show { display: flex; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <h1 id="mainTitle">台股法人/散戶籌碼觀測站</h1>
      <div class="toolbar">
        <input type="date" id="dateInput">
        <button class="btn" id="refreshBtn">重新整理</button>
        <div style="flex:1"></div>
        <div id="statusText">載入中...</div>
      </div>
    </div>

    <div class="card">
      <h2>個股搜尋</h2>
      <input type="search" id="stockSearch" placeholder="輸入代號或名稱，例如 2330 或 台積電">
      <div id="searchResults" style="margin-top:15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px;"></div>
    </div>

    <div class="layout-2">
      <div class="card">
        <h2 id="flowTitle">1. 每日法人 / 散戶買賣量綜合</h2>
        <div class="table-wrap" id="flowSummaryTable"></div>
      </div>
      <div class="card">
        <h2>量能摘要</h2>
        <div id="flowBars" style="display:flex; flex-direction:column; gap:15px;"></div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center">
        <h2>自選股監控</h2>
        <span id="watchlistMeta">共 0 檔</span>
      </div>
      <div id="watchlistTable"></div>
    </div>

    <div class="card">
      <h2>最新財報潛力前 20</h2>
      <div id="potentialTables"></div>
    </div>
  </div>

  <div class="loading-mask" id="loadingMask"><div style="color:white; font-size:20px;">資料更新中，請稍候...</div></div>

  <script src="./app.js"></script>
</body>
</html>
