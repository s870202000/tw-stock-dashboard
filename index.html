<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股籌碼觀測站 V3.1</title>
  <style>
    :root {
      --bg: #08111f; --panel: #0f1b2d; --line: rgba(255,255,255,.08);
      --text: #eaf2ff; --muted: #9fb2d1; --brand: #4ea1ff;
      --good: #3dd598; --danger: #ff6b7a; --radius: 18px;
    }
    body { margin: 0; font-family: sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; padding: 20px; }
    .shell { width: min(1480px, calc(100vw - 32px)); margin: 0 auto; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,.3); margin-bottom: 20px; }
    .toolbar { display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
    input[type="date"], input[type="search"] {
      background: #16243a; color: #fff; border: 2px solid var(--brand);
      border-radius: 12px; padding: 12px; font-size: 16px; font-weight: bold;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(48%) sepia(79%) saturate(1000%) hue-rotate(190deg); cursor: pointer;
    }
    .btn { background: var(--brand); color: #fff; border: 0; padding: 14px 30px; border-radius: 12px; cursor: pointer; font-weight: bold; }
    
    /* 排版核心修正 */
    .layout-2 { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
    .table-wrap { overflow-x: auto; width: 100%; border-radius: 12px; border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { background: rgba(255,255,255,0.05); }
    .up { color: var(--good); } .down { color: var(--danger); }
    
    @media (max-width: 1100px) { .layout-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <h1>台股法人/散戶籌碼觀測站</h1>
      <div class="toolbar">
        <div style="display:flex; flex-direction:column; gap:5px;">
          <label style="font-size:13px; color:var(--muted)">查詢日期</label>
          <input type="date" id="dateInput">
        </div>
        <button class="btn" id="refreshBtn">重新整理</button>
        <span id="statusText" style="color:var(--muted); font-size:14px; margin-left:10px;">載入中...</span>
      </div>
    </div>
    <div class="card">
      <h2>個股/ETF 搜尋</h2>
      <input type="search" id="stockSearch" style="width:100%" placeholder="輸入代號或名稱，例如 2330、台積電、0050">
    </div>
    <div class="layout-2">
      <div class="card">
        <h2>1. 每日法人 / 散戶買賣量綜合</h2>
        <div id="flowSummaryTable" class="table-wrap"></div>
      </div>
      <div class="card">
        <h2>量能摘要</h2>
        <div id="flowBars" style="display:flex; flex-direction:column; gap:15px;"></div>
      </div>
    </div>
    <div class="card">
      <h2>最新財報潛力前 20</h2>
      <div id="potentialTable" class="table-wrap"></div>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
